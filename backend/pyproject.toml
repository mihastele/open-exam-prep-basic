[project]
name = "openexamprep-api"
version = "0.1.0"
description = "openExamPrep FastAPI backend: grounded tutor, practice, plans, exams."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pypdf>=4.0",
    "python-pptx>=0.6.23",
    "pillow>=10.0",
    "langfuse>=2.50",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
